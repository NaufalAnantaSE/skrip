syntax = "proto3";

package product;

service ProductService {
  rpc GetProduct (PayloadRequest) returns (ProductResponse);
}

message PayloadRequest {
  string payloadType = 1;
}

message ProductResponse {
  int32 id = 1;
  string name = 2;
  string price = 3;
  string payloadType = 4;
  string description = 5;
}
